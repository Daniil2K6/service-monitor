{% extends "base.html" %}

{% block title %}
    {{ title }} – ServiceMonitor
{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>

    {% if error %}
        <p class="text-danger">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ action }}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Название</label>
            <input
                class="form-control"
                type="text"
                name="name"
                value="{{ name }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">URL</label>
            <input
                class="form-control"
                type="url"
                name="url"
                value="{{ url }}"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            <input
                class="form-control"
                type="text"
                name="description"
                value="{{ description }}"
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Группа</label>
            <select class="form-select" name="group">
                <option value="">Без группы</option>
                {% for group in groups %}
                    <option
                        value="{{ group.name }}"
                        {% if group.name == group_value %}selected{% endif %}
                    >
                        {{ group.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary" type="submit">
            {{ submit }}
        </button>
        <a
            class="btn btn-outline-secondary"
            href="{% url 'services:list' %}"
        >
            Отмена
        </a>
    </form>
{% endblock %}
