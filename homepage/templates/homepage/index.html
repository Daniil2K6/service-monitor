{% extends "base.html" %}

{% block title %}
    Главная – ServiceMonitor
{% endblock %}

{% block content %}
    <h1 class="display-4">ServiceMonitor</h1>

    <p class="lead">
        Мониторинг доступности веб-сервисов.
    </p>

    <p>
        Сервисов: {{ services_count }},
        групп: {{ groups_count }}.
    </p>

    <a href="{% url 'services:list' %}" class="btn btn-primary me-2">
        Сервисы
    </a>
    <a href="{% url 'groups:list' %}" class="btn btn-secondary">
        Группы
    </a>
{% endblock %}
